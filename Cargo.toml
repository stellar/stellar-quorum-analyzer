[package]
name = "stellar-quorum-analyzer"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
petgraph = "=0.6.5"
stellar-xdr = { version = "=27.0.0", git = "https://github.com/stellar/rs-stellar-xdr", rev = "3305b3e31f19fdb4e64e4b7a4354bb120cdf4415" }
json = { version = "0.12.4", optional = true }
itertools = "0.10.5"
stellar-strkey = "0.0.13"
batsat = "=0.6.0"
log = "0.4.19"

[dev-dependencies]
varisat = "=0.2.2"
screwsat = "=2.1.5"
splr = "=0.17.2"
prettytable = "0.10.0"
dimacs = "0.2.0"
json = { version = "0.12.4" }

[[bench]]
harness = false
bench = true
name = "solver_comparison"
path = "benches/solver_comparison.rs"

[features]
default = []
json = ["dep:json"]
# Development-only: installs a measurement-only global allocator and enables a
# test that compares real peak heap usage against the estimator. Never enable in
# a normal build -- it overrides the global allocator.
mem_eval = []
